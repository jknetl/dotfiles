[mgr]
linemode = "mtime"

[opener]
firefox = [
	{ run = 'open -a Firefox %s', orphan = true, desc = "Open in Firefox", for = "macos" },
]
glow = [
	{ run = 'glow -w0 -p %s', block = true, desc = "Preview with glow", for = "unix" },
]

[open]
prepend_rules = [
	{ mime = "text/html", use = [ "edit", "firefox" ] },
	{ url = "*.md", use = [ "edit", "glow" ] },
	{ url = "*.markdown", use = [ "edit", "glow" ] },
]

[plugin]
prepend_previewers = [
	{ url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
	{ url = "*.markdown", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
]

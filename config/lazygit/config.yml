gui:
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    authorColors:
      "*": "#b4befe"
git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
customCommands:
  - key: "<c-n>"
    context: localBranches
    description: Create branch from selected branch without checkout
    prompts:
      - type: input
        title: New branch name
        key: BranchName
    command: git branch {{.Form.BranchName | quote}} {{.SelectedLocalBranch.Name | quote}}
  - key: "<c-n>"
    context: remoteBranches
    description: Create branch from selected remote branch without checkout
    prompts:
      - type: input
        title: New branch name
        key: BranchName
    command: git branch --no-track {{.Form.BranchName | quote}} {{.SelectedRemoteBranch.RemoteName | quote}}/{{.SelectedRemoteBranch.Name | quote}}
  - key: "<c-n>"
    context: commits
    description: Create branch from selected commit without checkout
    prompts:
      - type: input
        title: New branch name
        key: BranchName
    command: git branch {{.Form.BranchName | quote}} {{.SelectedLocalCommit.Hash}}
  - key: "<c-n>"
    context: subCommits
    description: Create branch from selected commit without checkout
    prompts:
      - type: input
        title: New branch name
        key: BranchName
    command: git branch {{.Form.BranchName | quote}} {{.SelectedSubCommit.Hash}}
